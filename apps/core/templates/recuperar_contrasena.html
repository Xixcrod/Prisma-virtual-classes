{% load django_bootstrap5 %}
{% bootstrap_css %}
{% bootstrap_javascript %}
{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña - PRISMA</title>
    <link rel="stylesheet" href="{% static 'css/recuperar_contrasena.css' %}">
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet"> 
</head>

<body>
    <div class="ambient-lights"></div>

    <div class="container">
        <div class="row">
            <div class="col-12 logo-container">
                <img src="{% static 'img/logo.png' %}" alt="PRISMA Logo" class="logo-img" />
            </div>
        </div>

        <div class="row align-items-center justify-content-center">
            <div class="col-lg-4 col-md-6">
                <div class="login-box">
                    <h2 class="login-title">Recuperar Contraseña</h2>

                    <form action="{% url 'processing_password' %}" method="POST">
                        {% csrf_token %}
                        
                        <label class="label-custom" for="username">Cédula</label>
                        <input type="text" id="username" name="username" class="custom-input" placeholder="Ingrese su cédula" required />

                        <label class="label-custom" for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" class="custom-input" placeholder="ejemplo@correo.com" required />

                        <button type="submit" class="btn-recuperar">Enviar Solicitud</button>
                        
                        <a href="{% url 'login' %}" class="back-link">Volver al inicio de sesión</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'bootstrap/js/bootstrap.min.js' %}"></script>
</body>

</html>
