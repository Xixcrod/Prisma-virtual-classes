{% extends 'layouts/base.html' %}

{% block title %}Editar Carrera{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">Editar Carrera</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre de la Carrera</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ carrera.nombre }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="cantidad_semestres" class="form-label">Cantidad de Semestres</label>
                            <input type="number" class="form-control" id="cantidad_semestres" name="cantidad_semestres" value="{{ carrera.cantidad_semestres }}" min="1" max="12" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Actualizar</button>
                            <a href="{% url 'registrar_carrera_materia' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
