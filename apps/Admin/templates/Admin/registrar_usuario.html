{% extends "layouts/base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'Admin/css/registro_usuario.css' %}">
{% endblock %}

{% block content %}
<div class="registration-page">

    <div class="back-button-container">
        <a href="{% url 'dashboard' %}" class="btn-back-circle">VOLVER</a>
    </div>

    {% if messages %}
    <div class="container mt-2">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <h2 class="page-title">Registro de Usuario</h2>

    <div class="form-card">
        <!-- Imagen de recuadro iluminado como fondo decorativo opcional -->
        <div class="glow-overlay"></div>

        <form method="POST" class="admin-form" id="registroForm">
            {% csrf_token %}

            <!-- Selector de Rol con SVGs Originales -->
            <div class="role-selector">
                <label class="radio-container">
                    <input type="radio" name="rol" value="profesor" onclick="updateSelectors()" required>
                    <span class="label-text">Profesor</span>
                    <img src="{% static 'img/selector apagado.svg' %}" class="selector-svg" id="svg-profesor">
                </label>

                <label class="radio-container">
                    <input type="radio" checked="checked" name="rol" value="estudiante" onclick="updateSelectors()"
                        required>
                    <span class="label-text">Estudiante</span>
                    <img src="{% static 'img/selector encendido.svg' %}" class="selector-svg" id="svg-estudiante">
                </label>
            </div>

            <!-- Línea Colorida Decorativa -->
            <div class="divider-container">
                <img src="{% static 'img/linea colorida.svg' %}" class="linea-colorida">
            </div>

            <div class="inputs-container">
                <div class="input-wrapper">
                    <input type="text" id="nombres" name="nombres" required maxlength="20"
                        placeholder="Nombre de Usuario">
                </div>
                <div class="input-wrapper">
                    <input type="text" id="apellidos" name="apellidos" required maxlength="20" placeholder="Apellidos">
                </div>
                <div class="input-wrapper">
                    <input type="email" id="correo" name="correo" required placeholder="Correo Electrónico">
                </div>
                <div class="input-wrapper">
                    <input type="text" id="telefono" name="telefono" required maxlength="11" placeholder="Teléfono">
                </div>
                <div class="input-wrapper">
                    <input type="text" id="cedula" name="cedula" required maxlength="8" placeholder="Cédula">
                </div>
                <div class="input-wrapper" id="carrera-group">
                    <select id="carrera" name="carrera" class="custom-select">
                        <option value="" disabled selected>Seleccione Carrera</option>
                        {% for carrera in carreras %}
                        <option value="{{ carrera.id }}">{{ carrera.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-footer">
                <button type="submit" class="submit-btn">REGISTRAR</button>
            </div>

            <div class="text-center mt-3">
                <a href="{% url 'dashboard' %}" class="back-link-simple">Volver al panel</a>
            </div>
        </form>
    </div>
</div>

<script>
    function updateSelectors() {
        const radios = document.getElementsByName('rol');
        const svgProfesor = document.getElementById('svg-profesor');
        const svgEstudiante = document.getElementById('svg-estudiante');
        const carreraGroup = document.getElementById('carrera-group');
        const carreraSelect = document.getElementById('carrera');

        let selected = 'estudiante';
        for (const r of radios) {
            if (r.checked) {
                selected = r.value;
                break;
            }
        }

        // Rutas estáticas (Django las procesará)
        const pathEncendido = "{% static 'img/selector encendido.svg' %}";
        const pathApagado = "{% static 'img/selector apagado.svg' %}";

        if (selected === 'profesor') {
            svgProfesor.src = pathEncendido;
            svgEstudiante.src = pathApagado;
            carreraGroup.style.display = 'none';
            carreraSelect.required = false;
        } else {
            svgProfesor.src = pathApagado;
            svgEstudiante.src = pathEncendido;
            carreraGroup.style.display = 'block';
            carreraSelect.required = true;
        }
    }

    document.addEventListener('DOMContentLoaded', updateSelectors);
</script>

<script src="{% static 'Admin/js/registrar_usuario.js' %}"></script>

{% endblock %}
