{% extends 'layouts/base.html' %}
{% load static %}

{% block title %}Editar Materia{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'Admin/css/registrar_carrera_materia.css' %}">
<style>
    .edit-card {
        max-width: 500px;
        margin: 2rem auto;
    }
</style>
{% endblock %}

{% block content %}
<div class="admin-bg-dark">
    <div class="container">
        <a href="{% url 'registrar_carrera_materia' %}" class="btn-back-circle">VOLVER</a>

        {% if messages %}
        <div class="messages-container">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} glass-alert">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <div class="card shadow-lg edit-card">
            <div class="card-header border-0 bg-transparent">
                <h3 class="mb-0 text-center" style="color: var(--color-tertiary); font-weight: 800;">EDITAR MATERIA</h3>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label for="carrera" class="form-label small text-uppercase fw-bold opacity-75">Carrera</label>
                        <select class="form-select" id="carrera" name="carrera" required>
                            {% for c in carreras %}
                            <option value="{{ c.id }}" {% if c.id==materia.carrera.id %}selected{% endif %}>
                                {{ c.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="nombre" class="form-label small text-uppercase fw-bold opacity-75">Nombre de la
                            Materia</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ materia.nombre }}"
                            required>
                    </div>

                    <div class="mb-4">
                        <label for="semestre"
                            class="form-label small text-uppercase fw-bold opacity-75">Semestre</label>
                        <input type="number" class="form-control" id="semestre" name="semestre" min="1" max="12"
                            value="{{ materia.semestre }}" required>
                    </div>

                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-primary py-3 fw-bold text-uppercase"
                            style="border-radius: 30px;">Actualizar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
