<div class="card mb-3 me-4" style="background: color-mix(in srgb, #0f1020, transparent 50%); backdrop-filter: blur(8px); border: 1px solid var(--color-tertiary);">
  <div class="card-body text-center p-4">
    <h5 class="card-title text-uppercase fw-bold" style="color: var(--color-tertiary); letter-spacing: 1px;">Acceso Restringido</h5>
    <p class="card-text text-white opacity-75">Debes estar inscrito para ver el contenido.</p>

    {% if messages %}
      {% for message in messages %}
          <div class="alert border-0 text-white" style="background: color-mix(in srgb, var(--color-primary), transparent 40%);">
              {{ message }}
          </div>
      {% endfor %}
    {% endif %}

    <div class="mt-4">
      {% if estado == "RE" %}
        <button class="btn fw-bold text-white px-4" style="background-color: #dc3545; border: none; opacity: 0.8;" disabled>
          ACCESO RECHAZADO
        </button>

      {% elif estado == "PE" %}
        <button class="btn fw-bold text-white px-4" style="background-color: var(--color-fourth); border: none; opacity: 0.7;" disabled>
          SOLICITUD PENDIENTE
        </button>

      {% else %}
        <form action="{% url 'solicitar-acceso' curso.id %}" method="post">
          {% csrf_token %}
          <button type="submit" class="btn fw-bold text-dark px-5 text-uppercase btn-prisma-transition btn-prisma-solicitar" style="background-color: background-color: var(--color-tertiary); border: none;">
            Solicitar Acceso
          </button>
        </form>
      {% endif %}
    </div>
  </div>
</div>
