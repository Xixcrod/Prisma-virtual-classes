{% extends "layouts/base.html" %} {% load static %} {% block content %}
<a href="{{ url_retorno }}" class="btn btn-secondary">
   Volver
</a>
<div class="container video-detalle">
  <header class="video-header">
    <h2>{{ video.titulo|upper }}</h2>
    <div class="meta-info">
      <span class="profesor-tag">
        <strong>Profesor:</strong>
        {{ video.tema.curso.profesor.usuario.get_full_name }}
      </span>
    </div>
  </header>
  <div class="row">
    <div class="col-md-4">
      <h3>Descripción del vídeo:</h3>
      <p class="text-muted">{{ video.resumen }}</p>
    </div>
    <div>
      <h3>Duración: {{ video.duracion }}</h3>
    </div>
  </div>
  <div class="video-player-container row">
    <div class="col-md-8">
      <div class="video-player">
        <video width="100%" height="auto" controls>
          <source src="{{ video.archivo.url }}" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>
    </div>
  </div>
</div>

{%endblock %}
